format:
  html:
    theme: cosmo
    css:
      - styles/footer-accessibility.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: true
    code-summary: "Show code"
    number-sections: false
    fig-width: 10
    fig-height: 7
    ipynb-shell-interactivity: all
    include-in-header:
      - text: |
          <script src="https://cdn.plot.ly/plotly-latest.min.js" charset="utf-8"></script>
          <script>
          document.addEventListener("DOMContentLoaded", function () {
            var siteHeader = document.querySelector("body > header");
            var existing = document.querySelector(".site-strapline");
            if (!siteHeader || existing) {
              return;
            }

            var strapline = document.createElement("div");
            strapline.className = "site-strapline";
            strapline.setAttribute("role", "note");
            strapline.innerHTML = "<div class=\"site-strapline-inner\">A community portal for working on the Climate Knowledge Graph</div>";
            siteHeader.insertAdjacentElement("afterend", strapline);

            // Make the IPCC AR6 navbar text a visual label, not an interactive link.
            var navLinks = document.querySelectorAll(".navbar-nav .nav-link, .navbar-nav .dropdown-toggle");
            navLinks.forEach(function (link) {
              if (link.textContent && link.textContent.trim() === "IPCC AR6:") {
                link.classList.add("nav-label-item");
                link.setAttribute("aria-disabled", "true");
                link.setAttribute("tabindex", "-1");
              }
            });
          });
          </script>

          <style>
          .navbar-nav .nav-link.nav-label-item,
          .navbar-nav .dropdown-toggle.nav-label-item {
            font-weight: 700;
            pointer-events: none;
            cursor: default;
          }

          .navbar-nav .nav-link.nav-label-item:hover,
          .navbar-nav .dropdown-toggle.nav-label-item:hover,
          .navbar-nav .nav-link.nav-label-item:focus,
          .navbar-nav .dropdown-toggle.nav-label-item:focus,
          .navbar-nav .nav-link.nav-label-item.active,
          .navbar-nav .dropdown-toggle.nav-label-item.active {
            background: transparent !important;
            color: inherit !important;
            text-decoration: none !important;
            box-shadow: none !important;
          }
          </style>

execute:
  freeze: false
  warning: false
  enabled: true
  execute-dir: project
