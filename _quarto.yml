project:
  type: website
  output-dir: docs
  post-render:
    - scripts/post-render-copy-html.py
  render:
    - "*.qmd"
    - "*.md"
    - "research_data/data-vis/*.ipynb"
    - "research_data/data-xml-dtd/erm/erm-diagram.qmd"
    - "research_data/data-xml-dtd/erm/README.qmd"
    - "research_data/rdp/ar6-quantification-protocol.qmd"
    - "sparql_queries/*.ipynb"
    - "!research_data/data-vis/ar6-authors-distribution-analysis.ipynb"
    - "!research_data/data-vis/wikibase-inventory-dashboard.ipynb"
    - "!research_data/data-import/"

website:
  title: "ClimateKG Data Bench"
  navbar:
    left:
      - text: "Get Involved!"
        file: get-involved.qmd
      - text: "Data Analysis"
        menu:
          - text: "AR6 Author Distribution"
            file: research_data/data-vis/gender-distribution-simple.ipynb
          - text: "Top 10 Global South Authors"
            file: research_data/data-vis/authors-top-ten.ipynb
          - text: "Buildings & Urban"
            file: research_data/data-vis/buildings-urban-chapters.ipynb
          - text: "Class Instance Counts"
            file: sparql_queries/class-counts.ipynb
          - text: "Investigation: Q1 Count Discrepancy"
            file: sparql_queries/investigate-q1-count.ipynb
          - text: "---"
          - text: "View Notebooks on GitHub"
            href: https://github.com/TIBHannover/Climate-KG-data/tree/main/sparql_queries
      - text: "Knowledge Graph"
        file: knowledge-graph.qmd
      - text: "Data"
        menu:
          - text: "ClimateKG Dashboard"
            file: research_data/data-vis/kg-stats-dashboard.ipynb
          - text: "About Data"
            file: about-data.qmd
          - text: "Datasets"
            file: datasets.qmd
          - text: "ER model"
            file: er-model.qmd
          - text: "Research Data Protocol"
            file: research_data/rdp/ar6-quantification-protocol.qmd
          - text: "XML/HTML Pipeline Overview"
            file: xml-html-documentation.md
          - text: "---"
          - text: "Generated Data Pages"
          - text: "Authors Directory"
            href: data/authors-ar6.html
          - text: "Acronyms Index"
            href: data/acronyms-ar6.html
          - text: "Bibliography"
            href: data/bibliographic-ar6.html
          - text: "Corpus Structure"
            href: data/corpus-ar6.html
          - text: "Glossary"
            href: data/glossary-ar6.html  
      - text: "ER Model"  
        menu:
          - text: "ER Model Documentation"
            file: research_data/data-xml-dtd/erm/README.qmd
          - text: "Wikibase ERM Diagram"
            file: research_data/data-xml-dtd/erm/erm-diagram.qmd            
      - text: "Software"
        menu:
          - text: "Software"
            file: software.qmd
          - text: "CKG Scrape"
            file: ckg-scrape.qmd
          - text: "CKG Data"
            file: ckg-data.qmd
  page-footer:
    center: "[About](/about.html) | [Roadmap](/roadmap.html) | [Change Log](/change-log.html) | [Imprint](/imprint.html) | [Data protection](/data-protection.html) | [Terms of use](/terms-of-use.html) | [Accessibility](/accessibility.html)"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    code-summary: "Show code"
    number-sections: false
    fig-width: 10
    fig-height: 7
    ipynb-shell-interactivity: all
    include-in-header:
      - text: |
          <script src="https://cdn.plot.ly/plotly-latest.min.js" charset="utf-8"></script>

execute:
  freeze: false
  warning: false
  enabled: true
  execute-dir: project
